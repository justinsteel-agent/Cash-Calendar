<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#131E1C" />
<title>Steel — Cash Calendar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; background:#131E1C; -webkit-text-size-adjust:100%; }
  input[type=range] { -webkit-appearance:none; height:22px; background:transparent; }
  input[type=range]::-webkit-slider-runnable-track { height:3px; background:#2C403B; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:18px; height:18px;
    background:#C08F4A; margin-top:-8px; border-radius:0; cursor:pointer; }
  input[type=range]::-moz-range-track { height:3px; background:#2C403B; }
  input[type=range]::-moz-range-thumb { width:18px; height:18px; background:#C08F4A;
    border:none; border-radius:0; cursor:pointer; }
  input[type=number], input[type=date] { -webkit-appearance:none; }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="text/babel" data-presets="react">

/* ---------- localStorage persistence ---------- */
const KEY = "steel-cash-v1";
const load = () => { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch { return {}; } };
const saved = load();
const save = (k, v) => {
  try { const s = load(); s[k] = v; localStorage.setItem(KEY, JSON.stringify(s)); } catch {}
};
function useSaved(key, init) {
  const [v, setV] = React.useState(saved[key] !== undefined ? saved[key] : init);
  return [v, (nv) => { const val = typeof nv === "function" ? nv(v) : nv; setV(val); save(key, val); }];
}

/* ---------- tokens ---------- */
const C = {
  ground: "#131E1C",
  panel: "#1B2A27",
  panel2: "#213230",
  line: "#2C403B",
  paper: "#E6E1D4",
  dim: "#8A9E98",
  brass: "#C08F4A",
  signal: "#C4553D",
  green: "#6E9E85",
};
const MONO = "ui-monospace, SFMono-Regular, Menlo, Consolas, monospace";
const DISP = "'Oswald', 'Arial Narrow', 'Helvetica Neue', sans-serif";
const BODY = "-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif";

const usd = (n) =>
  (n < 0 ? "-" : "") + "$" + Math.abs(Math.round(n)).toLocaleString();

/* ---------- seed: live SureSend pipeline ---------- */
const SEED_PIPELINE = [
  { id: 1, name: "Rion St — both sides", side: "Listing", value: 165000, stage: "Under Contract", close: "2026-08-24", rate: 3, net: 500 },
  { id: 4, name: "Melson – 810 River Oaks Cir", side: "Listing", value: 1385000, stage: "Listing Won", close: "", rate: 3 },
  { id: 5, name: "Wilder – 640 Whispering Pines", side: "Listing", value: 850000, stage: "Listing Won", close: "", rate: 3 },
  { id: 6, name: "Bang – 979 Club Circle", side: "Listing", value: 730000, stage: "Seller Consult", close: "", rate: 3 },
  { id: 7, name: "41 Spicebush Lane", side: "Listing", value: 750000, stage: "Seller Consult", close: "", rate: 3 },
  { id: 8, name: "Kennerly – 155 Berkshire Loop", side: "Listing", value: 680000, stage: "Seller Consult", close: "", rate: 3 },
  { id: 9, name: "Fontana – 3 Car Garage", side: "Buyer", value: 1000000, stage: "Property Search", close: "", rate: 3 },
  { id: 10, name: "Smalls – TBD Kent Rd", side: "Listing", value: 99500, stage: "Listed on MLS", close: "", rate: 3 },
  { id: 11, name: "Parents' property", side: "Listing", value: 0, stage: "Under Contract", close: "2026-08-29", rate: 0, flat: 37500 },
];

const grossOf = (d) => (d.flat != null ? d.flat : d.value * (d.rate / 100));
const netOf = (d, split) => (d.net != null ? d.net : grossOf(d) * (split / 100));
/* what counts:
   listings  -> signed listings count; consultations never do
   buyers    -> only if genuinely under contract with a close date  */
const counts = (d) => {
  if (d.stage === "Seller Consult") return false;
  if (d.side === "Buyer") return d.stage === "Under Contract" && !!d.close;
  return true;
};
const whyOut = (d) => {
  if (d.stage === "Seller Consult") return "excluded — consultation";
  if (d.side === "Buyer") return "excluded — buyer, not under contract";
  return "excluded";
};

const STAGE_ODDS = {
  "Under Contract": 0.9,
  "Offer Submitted": 0.7,
  "Listing Won": 0.45,
  "Listed on MLS": 0.4,
  "Seller Consult": 0.2,
  "Property Search": 0.15,
};

/* power bill by month index */
const POWER = [1000, 900, 700, 550, 500, 550, 600, 600, 550, 450, 500, 800];

const SEED_BILLS = [
  { id: "a", name: "Groceries", amt: 1500, day: 1, kind: "Variable" },
  { id: "b", name: "Gas", amt: 500, day: 1, kind: "Variable" },
  { id: "c", name: "Kids", amt: 500, day: 1, kind: "Variable" },
  { id: "d", name: "Adults", amt: 500, day: 1, kind: "Variable" },
  { id: "e", name: "Power", amt: 0, day: 12, kind: "Utility", seasonal: true },
  { id: "f", name: "Water + Trash", amt: 104, day: 15, kind: "Utility" },
  { id: "g", name: "Phone", amt: 200, day: 18, kind: "Utility" },
  { id: "h", name: "Internet", amt: 80, day: 20, kind: "Utility" },
  { id: "i", name: "Streaming", amt: 100, day: 22, kind: "Utility" },
  { id: "j", name: "Car insurance", amt: 350, day: 5, kind: "Insurance" },
  { id: "k", name: "Home insurance", amt: 450, day: 5, kind: "Insurance" },
  { id: "o", name: "Family loan", amt: 600, day: 1, kind: "Obligation" },
  { id: "p", name: "Tax reserve", amt: 1800, day: 15, kind: "Tax" },
];

const SEED_ANNUAL = [
  { id: "x1", name: "Christmas", month: 11, day: 20, amt: 2000 },
  { id: "x2", name: "Family vacation", month: 6, day: 1, amt: 5000 },
  { id: "x3", name: "Tuition — spring half", month: 0, day: 15, amt: 8500 },
  { id: "x4", name: "Tuition — fall half", month: 7, day: 15, amt: 8500, paid: true },
];

/* past-due, one time only */
const SEED_ARREARS = [
  { id: "r1", name: "Electric — past due", date: "2026-08-31", amt: 2000 },
  { id: "r2", name: "Phone — one behind", date: "2026-08-18", amt: 200 },
  { id: "r3", name: "Internet — one behind", date: "2026-08-20", amt: 80 },
];

const KIND_COLOR = {
  Annual: "#B0754F",
  Variable: "#8A9E98",
  Utility: "#6E8C9E",
  Insurance: "#9E8A6E",
  Debt: "#C08F4A",
  Fixed: "#7C918B",
  Obligation: "#C4553D",
  Tax: "#A0705C",
};

function App() {
  const [pipeline, setPipeline] = useSaved("pipeline", SEED_PIPELINE);
  const [bills, setBills] = useSaved("bills", SEED_BILLS);
  const [openingBal, setOpeningBal] = useSaved("openingBal", 0);
  const [houseSplit, setHouseSplit] = useSaved("houseSplit", 50);
  const [lagDays, setLagDays] = useSaved("lagDays", 3);
  const [weighted, setWeighted] = useSaved("weighted", false);
  const [horizon, setHorizon] = useSaved("horizon", 210);
  const [dom, setDom] = useSaved("dom", 105);
  const [annual] = useSaved("annual", SEED_ANNUAL);
  const [arrears] = useSaved("arrears", SEED_ARREARS);
  const [warnDays, setWarnDays] = useSaved("warnDays", 45);
  const [reserveMonths, setReserveMonths] = useSaved("reserveMonths", 6);
  const [loanRunRate, setLoanRunRate] = useSaved("loanRunRate", 2900);
  const [splitBiz, setSplitBiz] = useSaved("splitBiz", 50);
  const [splitIdx, setSplitIdx] = useSaved("splitIdx", 30);
  const [slip, setSlip] = useSaved("slip", 0);
  const [safeBuffer, setSafeBuffer] = useSaved("safeBuffer", true);
  // business P&L (monthly, on the 50% that stays in the company)
  const [biz, setBiz] = useSaved("biz", [
    { id: "b1", name: "Agent splits", amt: 2200 },
    { id: "b2", name: "Marketing / lead gen", amt: 1500 },
    { id: "b3", name: "Transaction coordinator", amt: 900 },
    { id: "b4", name: "VA / admin", amt: 800 },
    { id: "b5", name: "Office, dues, MLS, E&O", amt: 600 },
    { id: "b6", name: "Software / CRM", amt: 350 },
  ]);
  const [liabs, setLiabs] = useSaved("liabs", [
    { id: "l1", name: "IRS back returns", amt: 0, note: "notice received, amount unknown", when: "unknown" },
    { id: "l2", name: "Health insurance cliff", amt: 2000, note: "monthly, when income clears Medicaid", when: "at income transition" },
    { id: "l3", name: "Family loan principal", amt: 391400, note: "0% to you, 7.75% to your parents", when: "ongoing" },
  ]);
  const [tab, setTab] = useSaved("tab", "calendar");
  const [loanBal, setLoanBal] = useSaved("loanBal", 391400);
  const [loanPay, setLoanPay] = useSaved("loanPay", 600);

  const today = new Date(2026, 7, 8);

  /* ---- build event ledger ---- */
  const events = React.useMemo(() => {
    const out = [];

    pipeline.forEach((d) => {
      if (!counts(d)) return;
      let cd, projected = false;
      if (d.close) {
        cd = new Date(d.close + "T12:00:00");
      } else if (d.side === "Listing") {
        cd = new Date(today);
        cd.setDate(cd.getDate() + dom + slip);
        projected = true;
      } else {
        return; // undated buyer deals contribute nothing
      }
      const wire = new Date(cd);
      wire.setDate(wire.getDate() + lagDays);
      const odds = weighted ? STAGE_ODDS[d.stage] ?? 0.5 : 1;
      out.push({
        date: wire,
        label: d.name,
        sub: projected
          ? `projected ${cd.toLocaleDateString("en-US", { month: "short", day: "numeric" })} · ${dom}d DOM · +${lagDays}d wire`
          : `closes ${cd.toLocaleDateString("en-US", { month: "short", day: "numeric" })} · +${lagDays}d wire`,
        amt: netOf(d, houseSplit) * odds,
        type: "in",
        color: projected ? C.brass : C.green,
        projected,
      });
    });

    const end = new Date(today);
    end.setDate(end.getDate() + horizon);
    let cur = new Date(today.getFullYear(), today.getMonth(), 1);
    while (cur <= end) {
      const m = cur.getMonth(), y = cur.getFullYear();
      const curMonth = m === today.getMonth() && y === today.getFullYear();
      const daysInM = new Date(y, m + 1, 0).getDate();
      const leftFrac = (daysInM - today.getDate() + 1) / daysInM;

      bills.forEach((b) => {
        const d = new Date(y, m, Math.min(b.day, 28));
        let amt = b.seasonal ? POWER[m] : b.amt;
        let date = d, sub = b.kind;

        if (d < today) {
          // already came due this month
          if (!curMonth || b.kind !== "Variable") return; // fixed items are settled
          amt = amt * leftFrac;                            // variable: only the rest of the month
          date = new Date(today);
          sub = `${b.kind} · rest of month`;
        }
        if (date > end || !amt) return;

        out.push({ date, label: b.name, sub, amt: -amt, type: "out", color: KIND_COLOR[b.kind] });
      });
      annual.forEach((a) => {
        if (a.month !== m || a.paid) return;
        const d = new Date(y, m, a.day);
        if (d < today || d > end) return;
        out.push({ date: d, label: a.name, sub: "Annual", amt: -a.amt, type: "out", color: KIND_COLOR.Annual });
      });
      cur = new Date(y, m + 1, 1);
    }

    arrears.forEach((r) => {
      const d = new Date(r.date + "T12:00:00");
      if (d < today || d > end) return;
      out.push({ date: d, label: r.name, sub: "Past due", amt: -r.amt, type: "out", color: C.signal });
    });

    out.sort((a, b) => a.date - b.date);
    let bal = openingBal;
    out.forEach((e) => { bal += e.amt; e.bal = bal; });
    return out;
  }, [pipeline, bills, openingBal, houseSplit, lagDays, weighted, horizon, dom, annual, arrears, slip]);

  const chartData = React.useMemo(
    () => events.map((e) => ({
      d: e.date.toLocaleDateString("en-US", { month: "short", day: "numeric" }),
      bal: Math.round(e.bal),
    })),
    [events]
  );

  const monthlyBurn = React.useMemo(() => {
    const avgPower = POWER.reduce((a, b) => a + b, 0) / 12;
    const b = bills.reduce((sum, x) => sum + (x.seasonal ? avgPower : x.amt), 0);
    const a = annual.reduce((sum, x) => sum + x.amt, 0) / 12; // both tuition halves count
    return b + a;
  }, [bills, annual]);

  const sixMonth = monthlyBurn * 6;

  /* Coverage: what today's cash is already committed to, measured only
     against CONFIRMED income. Projected listings never create headroom. */
  const coverage = React.useMemo(() => {
    const nextIn = events.find((e) => e.amt > 0 && !e.projected);
    const wall = nextIn ? nextIn.date : new Date(today.getTime() + horizon * 86400000);
    const committed = events
      .filter((e) => e.amt < 0 && e.date <= wall)
      .reduce((t, e) => t + Math.abs(e.amt), 0);
    const days = Math.round((wall - today) / 86400000);
    const gap = committed - openingBal;
    const covered = monthlyBurn > 0 ? Math.floor((openingBal / monthlyBurn) * 30.4) : 0;
    return { committed, days, gap, covered, wall, confirmed: !!nextIn };
  }, [events, openingBal, monthlyBurn, horizon]);
  const [savTarget, setSavTarget] = useSaved("savTarget", 30000);

  const minBal = events.length ? Math.min(...events.map((e) => e.bal)) : openingBal;
  const endBal = events.length ? events[events.length - 1].bal : openingBal;
  const totalIn = events.filter((e) => e.amt > 0).reduce((s, e) => s + e.amt, 0);
  const totalOut = events.filter((e) => e.amt < 0).reduce((s, e) => s + e.amt, 0);
  const firstNeg = events.find((e) => e.bal < 0);

  const alert = React.useMemo(() => {
    const neg = events.find((e) => e.bal < 0);
    if (!neg) return null;
    const days = Math.round((neg.date - today) / 86400000);
    const worst = Math.min(...events.filter((e) => e.date <= new Date(neg.date.getTime() + 60 * 86400000)).map((e) => e.bal));
    return { date: neg.date, days, worst, need: Math.abs(worst) / (houseSplit / 100) };
  }, [events, houseSplit]);

  const bizPL = React.useMemo(() => {
    const grossAll = pipeline.filter(counts).reduce((t, d) => t + grossOf(d), 0);
    const monthsSpan = horizon / 30.4;
    const revMo = (grossAll * (1 - houseSplit / 100)) / monthsSpan;
    const costMo = biz.reduce((t, x) => t + x.amt, 0);
    return { revMo, costMo, marginMo: revMo - costMo, pct: revMo ? ((revMo - costMo) / revMo) * 100 : 0 };
  }, [pipeline, houseSplit, biz, horizon]);

  const goal = React.useMemo(() => {
    const closed = pipeline.filter((d) => counts(d) && d.close).reduce((t, d) => t + grossOf(d), 0);
    const projected = pipeline.filter((d) => counts(d) && !d.close).reduce((t, d) => t + grossOf(d), 0);
    return { closed, projected };
  }, [pipeline]);

  const gates = React.useMemo(() => {
    const arrearsTot = arrears.reduce((t, r) => t + r.amt, 0);
    const reserve = monthlyBurn * reserveMonths;
    const loanStep = (loanRunRate - 600) * 12;
    const yearBurn = monthlyBurn * 12;
    const need = yearBurn + loanStep + reserve + arrearsTot;
    return {
      arrearsTot, reserve, loanStep, yearBurn, need,
      gross: need / (houseSplit / 100),
      volume: need / (houseSplit / 100) / 0.03,
    };
  }, [arrears, monthlyBurn, reserveMonths, loanRunRate, houseSplit]);

  const signBy = React.useMemo(() => {
    const d = new Date(today);
    d.setDate(d.getDate() + Math.max(0, 150 - dom)); // must sign this many days out to still close inside ~150d
    return d;
  }, [dom]);

  const undatedList = pipeline.filter((d) => !d.close && d.side === "Listing" && counts(d));
  const excluded = pipeline.filter((d) => !counts(d));

  /* loan */
  const loan = React.useMemo(() => {
    const rate = 0.0775 / 12;
    let b = loanBal, months = 0, parentInt = 0;
    while (b > 0 && months < 1200) {
      parentInt += b * rate;
      b -= loanPay;
      months++;
    }
    return { months, parentInt, daily: (loanBal * 0.0775) / 365 };
  }, [loanBal, loanPay]);

  const upd = (setter, arr) => (id, k, v) =>
    setter(arr.map((x) => (x.id === id ? { ...x, [k]: v } : x)));

  return (
    <div style={{ background: C.ground, minHeight: "100vh", color: C.paper, fontFamily: BODY, padding: "16px 14px 60px" }}>
      <div style={{ maxWidth: 860, margin: "0 auto" }}>

        {/* header */}
        <div style={{ borderBottom: `1px solid ${C.line}`, paddingBottom: 14, marginBottom: 18 }}>
          <div style={{ fontFamily: MONO, fontSize: 10, letterSpacing: 2, color: C.brass, textTransform: "uppercase" }}>
            Steel Household
          </div>
          <div style={{ fontFamily: DISP, fontSize: 30, fontWeight: 500, letterSpacing: -0.3, lineHeight: 1.1, marginTop: 4 }}>
            Cash Calendar
          </div>
          <div style={{ fontSize: 12, color: C.dim, marginTop: 5 }}>
            Pipeline closings + {lagDays}-day wire lag · {houseSplit}% to house · bills on due date
          </div>
        </div>

        {safeBuffer && (
          <div style={{ background: coverage.gap > 0 ? "rgba(196,85,61,0.13)" : C.panel,
            border: `1px solid ${coverage.gap > 0 ? C.signal : C.line}`, padding: "15px 15px", marginBottom: 14 }}>
            <div style={{ fontFamily: MONO, fontSize: 10, letterSpacing: 1.5, color: C.dim, textTransform: "uppercase" }}>
              Committed before the next confirmed wire
            </div>
            <div style={{ fontFamily: MONO, fontSize: 34, fontWeight: 700, letterSpacing: -0.8, marginTop: 4, color: C.paper }}>
              {usd(coverage.committed)}
            </div>
            <div style={{ fontSize: 12, color: C.dim, marginTop: 4 }}>
              {usd(openingBal)} on hand · next confirmed wire in {coverage.days} days
            </div>
            {coverage.gap > 0 && (
              <div style={{ marginTop: 11, paddingTop: 10, borderTop: `1px solid rgba(196,85,61,0.35)` }}>
                <div style={{ fontFamily: MONO, fontSize: 9.5, letterSpacing: 1.1, color: C.signal, textTransform: "uppercase" }}>Unfunded</div>
                <div style={{ fontFamily: MONO, fontSize: 23, fontWeight: 700, color: C.signal, marginTop: 3 }}>{usd(coverage.gap)}</div>
              </div>
            )}
          </div>
        )}

        {/* stat strip */}
        <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit,minmax(120px,1fr))", gap: 8, marginBottom: 16 }}>
          {[
            { l: "Opening", v: usd(openingBal), c: C.paper },
            { l: "Income in", v: usd(totalIn), c: C.green },
            { l: "Bills out", v: usd(totalOut), c: C.signal },
            { l: "Low point", v: usd(minBal), c: minBal < 0 ? C.signal : C.brass },
            { l: `Day ${horizon}`, v: usd(endBal), c: endBal < 0 ? C.signal : C.paper },
            { l: "Months covered", v: (endBal / monthlyBurn).toFixed(1), c: endBal / monthlyBurn < 6 ? C.signal : C.green },
          ].map((s) => (
            <div key={s.l} style={{ background: C.panel, border: `1px solid ${C.line}`, padding: "10px 11px" }}>
              <div style={{ fontFamily: MONO, fontSize: 9, letterSpacing: 1.2, color: C.dim, textTransform: "uppercase" }}>{s.l}</div>
              <div style={{ fontFamily: MONO, fontSize: 17, fontWeight: 600, color: s.c, marginTop: 3 }}>{s.v}</div>
            </div>
          ))}
        </div>

        {alert && (
          <div style={{ background: "rgba(196,85,61,0.13)", border: `1px solid ${C.signal}`, padding: "13px 14px", marginBottom: 16 }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", gap: 10 }}>
              <div style={{ fontFamily: MONO, fontSize: 10, letterSpacing: 1.4, color: C.signal, textTransform: "uppercase" }}>
                {alert.days <= warnDays ? "Act now" : "Shortfall ahead"}
              </div>
              <div style={{ fontFamily: MONO, fontSize: 22, fontWeight: 700, color: C.signal }}>{alert.days}d</div>
            </div>
            <div style={{ fontSize: 13.5, marginTop: 5, lineHeight: 1.5 }}>
              Cash runs out {alert.date.toLocaleDateString("en-US", { month: "long", day: "numeric" })}. Deepest point {usd(alert.worst)}.
            </div>
            <div style={{ borderTop: `1px solid rgba(196,85,61,0.35)`, marginTop: 10, paddingTop: 9 }}>
              <div style={{ fontFamily: MONO, fontSize: 9.5, letterSpacing: 1.1, color: C.dim, textTransform: "uppercase" }}>
                Gross commission needed to close the gap
              </div>
              <div style={{ fontFamily: MONO, fontSize: 25, fontWeight: 700, color: C.brass, marginTop: 3 }}>{usd(alert.need)}</div>
              <div style={{ fontFamily: MONO, fontSize: 10, color: C.dim, marginTop: 2 }}>
                ≈ {usd(alert.need / 0.03)} in volume at 3% · must wire before {alert.date.toLocaleDateString("en-US", { month: "short", day: "numeric" })}
              </div>
              <div style={{ marginTop: 10, paddingTop: 9, borderTop: `1px solid rgba(196,85,61,0.35)` }}>
                <div style={{ fontFamily: MONO, fontSize: 9.5, letterSpacing: 1.1, color: C.dim, textTransform: "uppercase" }}>
                  Sign a listing by
                </div>
                <div style={{ fontFamily: MONO, fontSize: 20, fontWeight: 700, color: C.paper, marginTop: 3 }}>
                  {signBy.toLocaleDateString("en-US", { month: "long", day: "numeric" })}
                </div>
                <div style={{ fontFamily: MONO, fontSize: 10, color: C.dim, marginTop: 2 }}>
                  at {dom} days to close, anything signed later misses this cycle
                </div>
              </div>
            </div>
          </div>
        )}

        {/* chart */}
        <div style={{ background: C.panel, border: `1px solid ${C.line}`, padding: "14px 8px 6px", marginBottom: 18 }}>
          <div style={{ fontFamily: MONO, fontSize: 10, letterSpacing: 1.4, color: C.dim, textTransform: "uppercase", padding: "0 8px 10px" }}>
            Running balance
          </div>
          <Spark data={chartData} target={savTarget} />
        </div>

        {/* tabs */}

                    onChange={(e) => upd(setBills, bills)(b.id, "day", parseInt(e.target.value) || 1)} style={inp} />
                </label>
                <label style={{ width: 86 }}>
                  <div style={{ fontFamily: MONO, fontSize: 8.5, color: C.dim, letterSpacing: 0.8, textTransform: "uppercase" }}>Amount</div>
                  <input type="number" value={b.seasonal ? POWER[today.getMonth()] : b.amt} disabled={b.seasonal}
                    onChange={(e) => upd(setBills, bills)(b.id, "amt", parseFloat(e.target.value) || 0)}
                    style={{ ...inp, opacity: b.seasonal ? 0.5 : 1 }} />
                </label>
              </div>
            ))}
          </div>
        )}

        {/* LOAN */}
        {tab === "loan" && (
          <div>
            <div style={{ background: C.panel, border: `1px solid ${C.signal}`, padding: "18px 16px", marginBottom: 12, textAlign: "center" }}>
              <div style={{ fontFamily: MONO, fontSize: 10, letterSpacing: 1.6, color: C.signal, textTransform: "uppercase" }}>
                Interest your parents pay · per day
              </div>
              <div style={{ fontFamily: MONO, fontSize: 42, fontWeight: 700, color: C.signal, letterSpacing: -1, marginTop: 6 }}>
                {usd(loan.daily)}
              </div>
              <div style={{ fontSize: 12, color: C.dim, marginTop: 4 }}>
                7.75% (prime + 1) on {usd(loanBal)} · you owe principal only
              </div>
            </div>

            <div style={{ background: C.panel, border: `1px solid ${C.line}`, padding: "14px 14px" }}>
              <div style={{ fontFamily: MONO, fontSize: 10, letterSpacing: 1.4, color: C.dim, textTransform: "uppercase", marginBottom: 10 }}>
                Your monthly payment
              </div>
              <input type="range" min="600" max="6000" step="100" value={loanPay}
                onChange={(e) => setLoanPay(parseInt(e.target.value))}
                style={{ width: "100%", accentColor: C.brass }} />
              <div style={{ fontFamily: MONO, fontSize: 28, fontWeight: 700, color: C.brass, marginTop: 6 }}>
                {usd(loanPay)}<span style={{ fontSize: 13, color: C.dim, fontWeight: 400 }}>/mo</span>
              </div>
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8, marginTop: 14 }}>
                <div style={{ background: C.panel2, padding: "10px 11px" }}>
                  <div style={{ fontFamily: MONO, fontSize: 9, color: C.dim, letterSpacing: 1, textTransform: "uppercase" }}>Payoff</div>
                  <div style={{ fontFamily: MONO, fontSize: 19, fontWeight: 600, marginTop: 3 }}>
                    {(loan.months / 12).toFixed(1)} yr
                  </div>
                  <div style={{ fontFamily: MONO, fontSize: 10, color: C.dim }}>you're {41 + Math.round(loan.months / 12)}</div>
                </div>
                <div style={{ background: C.panel2, padding: "10px 11px" }}>
                  <div style={{ fontFamily: MONO, fontSize: 9, color: C.dim, letterSpacing: 1, textTransform: "uppercase" }}>Their interest</div>
                  <div style={{ fontFamily: MONO, fontSize: 19, fontWeight: 600, color: C.signal, marginTop: 3 }}>
                    {usd(loan.parentInt)}
                  </div>
                  <div style={{ fontFamily: MONO, fontSize: 10, color: C.dim }}>total cost to them</div>
                </div>
              </div>
              <div style={{ fontSize: 12, color: C.dim, marginTop: 12, lineHeight: 1.55 }}>
                Balance is derived, not verified with your uncle. Confirm before trusting the payoff date.
              </div>
            </div>
          </div>
        )}

        {/* SETTINGS */}
        {tab === "settings" && (
          <div style={{ background: C.panel, border: `1px solid ${C.line}`, padding: "14px 14px" }}>
            {[
              ["Opening balance", openingBal, setOpeningBal, 0, 50000, 500],
              ["House split %", houseSplit, setHouseSplit, 0, 100, 5],
              ["Wire lag (days)", lagDays, setLagDays, 0, 14, 1],
              ["Horizon (days)", horizon, setHorizon, 30, 365, 30],
              ["Listing days to close", dom, setDom, 30, 240, 5],
              ["Warning window (days)", warnDays, setWarnDays, 7, 120, 7],
              ["Reserve months", reserveMonths, setReserveMonths, 1, 12, 1],
              ["Family loan run rate", loanRunRate, setLoanRunRate, 600, 6000, 100],
              ["Loan balance", loanBal, setLoanBal, 0, 600000, 5000],
            ].map(([l, v, set, mn, mx, st]) => (
              <div key={l} style={{ marginBottom: 18 }}>
                <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 5 }}>
                  <span style={{ fontFamily: MONO, fontSize: 10, letterSpacing: 1.2, color: C.dim, textTransform: "uppercase" }}>{l}</span>
                  <span style={{ fontFamily: MONO, fontSize: 13, fontWeight: 600, color: C.brass }}>
                    {l.includes("balance") ? usd(v) : v}
                  </span>
                </div>
                <input type="range" min={mn} max={mx} step={st} value={v}
                  onChange={(e) => set(parseInt(e.target.value))}
                  style={{ width: "100%", accentColor: C.brass }} />
              </div>
            ))}
            <label style={{ display: "flex", alignItems: "center", gap: 9, cursor: "pointer", paddingTop: 6, borderTop: `1px solid ${C.line}` }}>
              <input type="checkbox" checked={weighted} onChange={(e) => setWeighted(e.target.checked)}
                style={{ width: 17, height: 17, accentColor: C.brass }} />
              <div>
                <div style={{ fontSize: 13 }}>Probability-weight income</div>
                <div style={{ fontFamily: MONO, fontSize: 9.5, color: C.dim }}>discount closings by stage odds</div>
              </div>
            </label>
          </div>
        )}

        <div style={{ fontFamily: MONO, fontSize: 10, color: C.dim, textAlign: "center", marginTop: 30, lineHeight: 1.7, letterSpacing: 0.4 }}>
          Pipeline seeded from SureSend · {pipeline.length} active deals<br />
          Edits are session-only — not written back to SureSend
        </div>
      </div>
    </div>
  );
}

const inp = {
  width: "100%", background: C.ground, border: `1px solid ${C.line}`, color: C.paper,
  fontFamily: MONO, fontSize: 12, padding: "5px 7px", borderRadius: 0, boxSizing: "border-box",
};


/* ---------- tiny SVG chart, no dependencies ---------- */
function Spark({ data, target }) {
  if (!data.length) return null;
  const W = 640, H = 190, PAD = 30;
  const vals = data.map((d) => d.bal).concat([0, target]);
  const lo = Math.min(...vals), hi = Math.max(...vals);
  const span = hi - lo || 1;
  const x = (i) => PAD + (i / Math.max(1, data.length - 1)) * (W - PAD - 8);
  const y = (v) => H - 22 - ((v - lo) / span) * (H - 42);

  let d = "";
  data.forEach((p, i) => {
    if (i === 0) d += `M ${x(i)} ${y(p.bal)}`;
    else d += ` L ${x(i)} ${y(data[i - 1].bal)} L ${x(i)} ${y(p.bal)}`;
  });

  return (
    <svg viewBox={`0 0 ${W} ${H}`} style={{ width: "100%", height: 190, display: "block" }}>
      <line x1={PAD} x2={W - 8} y1={y(0)} y2={y(0)} stroke={C.signal} strokeDasharray="3 3" strokeWidth="1" />
      <line x1={PAD} x2={W - 8} y1={y(target)} y2={y(target)} stroke={C.green} strokeDasharray="2 5" strokeWidth="1" />
      <text x="2" y={y(0) + 3} fill={C.dim} fontSize="9" fontFamily={MONO}>0</text>
      <text x="2" y={y(target) + 3} fill={C.green} fontSize="9" fontFamily={MONO}>
        {Math.round(target / 1000)}k
      </text>
      <path d={d} fill="none" stroke={C.brass} strokeWidth="2" />
      <text x={PAD} y={H - 5} fill={C.dim} fontSize="9" fontFamily={MONO}>{data[0].d}</text>
      <text x={W - 8} y={H - 5} fill={C.dim} fontSize="9" fontFamily={MONO} textAnchor="end">
        {data[data.length - 1].d}
      </text>
    </svg>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
